[package]
name = "xmip-core-transport-wireless-m-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-wireless-m-bus"
description = "Wireless M-Bus transport: EN 13757-4 over the air — the link layer frame of length, control, manufacturer, address and control information with a CRC per block, carrying the same records and the same meter as wired M-Bus; a USB receiver stick on a serial port, or a loopback radio in process. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The names what this technology observed of a sender travels under, which
# the identity gates read (`context::property`, ADR-0019 amendment
# 2026-10-06).
context = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
# The application layer is wired M-Bus's: the records, the meter and the
# line boundary come from m-bus, never copied, as wireless-hart takes hart's.
m_bus = { workspace = true, optional = true }
# The estate's encoding primitives: the block CRC, CRC-16/EN-13757, and the
# receiver stick's message check, CRC-16/IBM-SDLC.
codec = { workspace = true, optional = true }
# The serial port a receiver stick is on, its messages SLIP frames
# (`Framing::Slip`), shared by every Location on a node naming it.
serial = { workspace = true, optional = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:context", "dep:m_bus", "dep:codec", "dep:serial"]
# The declaration alone, with the wait its default names.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# A pseudo-terminal pair a receiver stick in process answers on, Unix's
# (`serial::terminal`), for the tests alone.
serial = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
